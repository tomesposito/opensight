# Reference harness only. One host, one API/query/scheduler. No HA or deployment authorization.
name: opensight-reference
services:
  metadata:
    image: ${POSTGRES_IMAGE:?Supply a reviewed PostgreSQL image}
    pull_policy: never
    environment:
      POSTGRES_DB: opensight
      POSTGRES_USER: opensight_bootstrap
      POSTGRES_PASSWORD: ${OPENSIGHT_POSTGRES_BOOTSTRAP_PASSWORD:?Required}
      OPENSIGHT_METADATA_PASSWORD: ${OPENSIGHT_METADATA_PASSWORD:?Required}
      OPENSIGHT_TENANT_METADATA_PASSWORD: ${OPENSIGHT_TENANT_METADATA_PASSWORD:?Required}
    volumes:
      - metadata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-opensight.sh:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U opensight_bootstrap -d opensight']
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    image: opensight-reference:local
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Supply a reviewed Node 24 image}
    env_file: ${OPENSIGHT_RUNTIME_ENV_FILE:?Absolute path to a protected environment file}
    environment:
      OPENSIGHT_MODE: hosted
      OPENSIGHT_WORKER_ROLE: api-query-scheduler
    depends_on:
      metadata: {condition: service_healthy}
    networks: [private]
    read_only: true
    tmpfs: [/tmp:size=256m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${OPENSIGHT_API_MEMORY_LIMIT:-2g}
    pids_limit: 128
    stop_grace_period: 35s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
  ingress:
    image: opensight-reference:local
    pull_policy: never
    command: [node, packages/api/dist/reference-ingress-cli.js]
    environment:
      OPENSIGHT_PUBLIC_ORIGIN: ${OPENSIGHT_PUBLIC_ORIGIN:?Required HTTPS origin}
      OPENSIGHT_TLS_CERT: /tls/cert.pem
      OPENSIGHT_TLS_KEY: /tls/key.pem
    volumes:
      - ${OPENSIGHT_TLS_DIRECTORY:?Protected TLS directory}:/tls:ro
    networks: [private, edge]
    ports: ['${OPENSIGHT_HTTPS_PORT:-8443}:8443']
    depends_on: [api]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 32
networks:
  private: {internal: true}
  edge: {}
volumes:
  metadata: {}
