                - co-owner
    AnalysisDiagnostic:
      type: object
      required: [errorCode, message, path]
      properties:
        errorCode: { type: string }
        message: { type: string }
        path: { type: string }
    DashboardPublish:
      type: object
      additionalProperties: false
      required: []
      properties:
        dashboardId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,512}$
    DashboardPublished:
      type: object
      additionalProperties: false
      required:
      - DashboardId
      - Version
      - PublishedAt
      - Errors
      properties:
        DashboardId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,512}$
        Version:
          type: integer
          minimum: 1
        PublishedAt:
          type: string
          format: date-time
        Errors:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisDiagnostic'
    DashboardDescription:
      type: object
      additionalProperties: false
      required:
      - DashboardId
      - Name
      - Definition
      - Errors
      - Version
      - PublishedAt
      - SourceAnalysisId
      properties:
        DashboardId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,512}$
        Name:
          type: string
        Definition:
          type: object
          additionalProperties: true
        Errors:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisDiagnostic'
        Version:
          type: integer
          minimum: 1
        PublishedAt:
          type: string
          format: date-time
        SourceAnalysisId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,512}$
    DashboardSummary:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      - name
      - version
