openapi: 3.1.0
info:
  title: OpenSight headless API
  version: 1.0.0
  description: >-
    Builder-shaped REST surface for agents (issue #95, IDD D-37). Versioned
    and stable: breaking changes need a new version plus migration notes.
    The web app consumes the same API; existing unversioned routes are
    untouched. Implemented slices: datasets, querying, analyses, dashboards and assets.
    MCP mapping remains a separate slice.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: opensight.example
security:
  - bearerAuth: []
tags:
  - name: datasets
  - name: sources
  - name: querying
  - name: analyses
  - name: dashboards
  - name: assets
paths:
  /analyses/{id}/publish:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,512}$
    post:
      tags:
      - dashboards
      operationId: publish_analysis
      summary: Publish analysis
      description: Requires build capability and co-owner source access. Drafts publish with their validation
        diagnostics attached to the version (D-49); only unvalidatable definitions fail. Omit dashboardId
        to mint a dashboard; supplying it appends only to the same active source link. Hard validation
        failures return Errors and publish nothing.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardPublish'
      responses:
        '201':
          description: Success
          headers:
            ETag:
              description: Quoted published version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPublished'
        '400':
          $ref: '#/components/responses/AnalysisError'
        '401':
          $ref: '#/components/responses/AnalysisError'
        '403':
          $ref: '#/components/responses/AnalysisError'
        '404':
          $ref: '#/components/responses/AnalysisError'
        '409':
          $ref: '#/components/responses/AnalysisError'
        '412':
          $ref: '#/components/responses/AnalysisError'
        '413':
          $ref: '#/components/responses/AnalysisError'
        '422':
          $ref: '#/components/responses/AnalysisError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalysisError'
  /dashboards:
    get:
      tags:
      - dashboards
      operationId: list_dashboards
      summary: List dashboards
      description: Access-filtered latest-published summaries; Limit and Cursor headers.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPage'
        '400':
          $ref: '#/components/responses/AnalysisError'
        '401':
          $ref: '#/components/responses/AnalysisError'
        '403':
          $ref: '#/components/responses/AnalysisError'
        '404':
          $ref: '#/components/responses/AnalysisError'
        '409':
          $ref: '#/components/responses/AnalysisError'
        '412':
          $ref: '#/components/responses/AnalysisError'
        '413':
          $ref: '#/components/responses/AnalysisError'
        '422':
          $ref: '#/components/responses/AnalysisError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalysisError'
  /dashboards/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,512}$
    get:
      tags:
      - dashboards
      operationId: describe_dashboard
      summary: Describe dashboard
      description: Latest published definition; never the working analysis.
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted published version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDescription'
        '400':
          $ref: '#/components/responses/AnalysisError'
        '401':
          $ref: '#/components/responses/AnalysisError'
        '403':
          $ref: '#/components/responses/AnalysisError'
        '404':
          $ref: '#/components/responses/AnalysisError'
        '409':
          $ref: '#/components/responses/AnalysisError'
        '412':
          $ref: '#/components/responses/AnalysisError'
        '413':
          $ref: '#/components/responses/AnalysisError'
        '422':
          $ref: '#/components/responses/AnalysisError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalysisError'
    delete:
      tags:
      - assets
      operationId: delete_dashboard
      summary: Delete dashboard
      description: Build plus co-owner and current asset revision. Analysis delete preserves published dashboards
        and severs republish; dataset references from any analysis block deletion with DATASET_DELETE_BLOCKED_BY_ANALYSIS
        (409). Shares are removed with the asset.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted current asset revision; published definitions keep their own Version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRemoved'
        '400':
          $ref: '#/components/responses/AssetError'
        '401':
          $ref: '#/components/responses/AssetError'
        '403':
          $ref: '#/components/responses/AssetError'
        '404':
          $ref: '#/components/responses/AssetError'
        '409':
          $ref: '#/components/responses/AssetError'
        '412':
          $ref: '#/components/responses/AssetError'
        '422':
          $ref: '#/components/responses/AssetError'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AssetError'
  /dashboards/{id}/versions:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,512}$
    get:
      tags:
      - dashboards
      operationId: list_dashboard_versions
      summary: List dashboard versions
      description: Retained versions in ascending version order.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardVersionPage'
        '400':
          $ref: '#/components/responses/AnalysisError'
        '401':
          $ref: '#/components/responses/AnalysisError'
        '403':
          $ref: '#/components/responses/AnalysisError'
        '404':
          $ref: '#/components/responses/AnalysisError'
        '409':
          $ref: '#/components/responses/AnalysisError'
        '412':
          $ref: '#/components/responses/AnalysisError'
        '413':
          $ref: '#/components/responses/AnalysisError'
        '422':
          $ref: '#/components/responses/AnalysisError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalysisError'
  /dashboards/{id}/versions/{version}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,512}$
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      tags:
      - dashboards
      operationId: describe_dashboard_version
      summary: Describe dashboard version
      description: Immutable version definition; data is never stored in versions.
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted published version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDescription'
        '400':
          $ref: '#/components/responses/AnalysisError'
        '401':
          $ref: '#/components/responses/AnalysisError'
        '403':
          $ref: '#/components/responses/AnalysisError'
        '404':
          $ref: '#/components/responses/AnalysisError'
        '409':
          $ref: '#/components/responses/AnalysisError'
        '412':
          $ref: '#/components/responses/AnalysisError'
        '413':
          $ref: '#/components/responses/AnalysisError'
        '422':
          $ref: '#/components/responses/AnalysisError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalysisError'
    delete:
      tags:
      - dashboards
      operationId: delete_dashboard_version
      summary: Delete dashboard version
      description: Build capability and dashboard co-owner access. Latest version cannot be pruned (409).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: If-Match
        in: header
        required: true
        description: Quoted latest published version. Missing, malformed or stale precondition returns 412.
        schema:
          type: string
          pattern: ^"[1-9][0-9]*"$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardRemoved'
        '400':
          $ref: '#/components/responses/AnalysisError'
        '401':
          $ref: '#/components/responses/AnalysisError'
        '403':
          $ref: '#/components/responses/AnalysisError'
        '404':
          $ref: '#/components/responses/AnalysisError'
        '409':
          $ref: '#/components/responses/AnalysisError'
        '412':
          $ref: '#/components/responses/AnalysisError'
        '413':
          $ref: '#/components/responses/AnalysisError'
        '422':
          $ref: '#/components/responses/AnalysisError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalysisError'
  /dashboards/{id}/shares/{principalType}/{principalId}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,512}$
    - name: principalType
      in: path
      required: true
      schema:
        type: string
        enum:
        - user
        - group
    - name: principalId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,512}$
    get:
      tags:
      - assets
      operationId: get_dashboard_share
      summary: Get asset share
      description: Build plus co-owner through asset and folder grants, including read. Same-namespace resolved principals
        only. Definition-only grants never authorize prepared data. Last grant removal restores inheritance.
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted current asset revision; published definitions keep their own Version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetShare'
        '400':
          $ref: '#/components/responses/AssetError'
        '401':
          $ref: '#/components/responses/AssetError'
        '403':
          $ref: '#/components/responses/AssetError'
        '404':
          $ref: '#/components/responses/AssetError'
        '409':
          $ref: '#/components/responses/AssetError'
        '412':
          $ref: '#/components/responses/AssetError'
        '422':
          $ref: '#/components/responses/AssetError'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AssetError'
    put:
      tags:
      - assets
      operationId: set_dashboard_share
      summary: Set asset share
      description: Build plus co-owner through asset and folder grants, including read. Same-namespace resolved principals
        only. Definition-only grants never authorize prepared data. Last grant removal restores inheritance.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardShareWrite'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted current asset revision; published definitions keep their own Version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetShare'
        '400':
          $ref: '#/components/responses/AssetError'
        '401':
          $ref: '#/components/responses/AssetError'
        '403':
          $ref: '#/components/responses/AssetError'
        '404':
          $ref: '#/components/responses/AssetError'
        '409':
          $ref: '#/components/responses/AssetError'
        '412':
          $ref: '#/components/responses/AssetError'
        '422':
          $ref: '#/components/responses/AssetError'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AssetError'
    delete:
      tags:
      - assets
      operationId: delete_dashboard_share
      summary: Delete asset share
      description: Build plus co-owner through asset and folder grants, including read. Same-namespace resolved principals
        only. Definition-only grants never authorize prepared data. Last grant removal restores inheritance.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted current asset revision; published definitions keep their own Version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetShareDeleted'
        '400':
          $ref: '#/components/responses/AssetError'
        '401':
          $ref: '#/components/responses/AssetError'
        '403':
          $ref: '#/components/responses/AssetError'
        '404':
          $ref: '#/components/responses/AssetError'
        '409':
          $ref: '#/components/responses/AssetError'
        '412':
          $ref: '#/components/responses/AssetError'
        '422':
          $ref: '#/components/responses/AssetError'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AssetError'
  /dashboards/{id}/versions/{version}/visuals/{visualId}/query:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,512}$
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: visualId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,512}$
    post:
      tags:
      - dashboards
      operationId: query_dashboard_visual
      summary: Query dashboard visual
      description: Runs against live data under the authenticated reader own dataset access. Values only for controls
        declared by this frozen version.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardVisualQuery'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted published version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '400':
          $ref: '#/components/responses/AnalysisError'
        '401':
          $ref: '#/components/responses/AnalysisError'
        '403':
          $ref: '#/components/responses/AnalysisError'
        '404':
          $ref: '#/components/responses/AnalysisError'
        '409':
          $ref: '#/components/responses/AnalysisError'
        '412':
          $ref: '#/components/responses/AnalysisError'
        '413':
          $ref: '#/components/responses/AnalysisError'
        '422':
          $ref: '#/components/responses/AnalysisError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalysisError'
  /dashboards/{id}/exports:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,512}$
    post:
      tags:
      - dashboards
      operationId: create_dashboard_export
      summary: Create dashboard export
      description: Synchronous CSV or PDF using live authorized data and a frozen version (latest by default). CSV
        uses sheetId, visualId, row, column, value columns; spreadsheet-safe cells. PDF uses the existing report
        tables and requires operator-installed Chromium via OPENSIGHT_PDF_CHROMIUM. Larger/job-backed exports are
        deferred.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardExport'
      responses:
        '200':
          description: Transient artifact; never persisted as a snapshot.
          headers:
            ETag:
              description: Quoted published version
              schema:
                type: string
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/AnalysisError'
        '401':
          $ref: '#/components/responses/AnalysisError'
        '403':
          $ref: '#/components/responses/AnalysisError'
        '404':
          $ref: '#/components/responses/AnalysisError'
        '409':
          $ref: '#/components/responses/AnalysisError'
        '412':
          $ref: '#/components/responses/AnalysisError'
        '413':
          $ref: '#/components/responses/AnalysisError'
        '422':
          $ref: '#/components/responses/AnalysisError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalysisError'
  /analyses:
    get:
      tags: [analyses]
      operationId: list_analyses
      summary: List analyses
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisPage' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [analyses]
      operationId: create_analysis
      summary: Create analysis
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalysisCreate' }
      responses:
        '201':
          description: Created
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /analyses/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,512}$
    get:
      tags:
      - analyses
      operationId: describe_analysis
      summary: Describe analysis
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisDescription'
        '400':
          $ref: '#/components/responses/AnalysisError'
        '403':
          $ref: '#/components/responses/AnalysisError'
        '404':
          $ref: '#/components/responses/AnalysisError'
        '409':
          $ref: '#/components/responses/AnalysisError'
        '422':
          $ref: '#/components/responses/AnalysisError'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
      - analyses
      operationId: update_analysis
      summary: Update analysis
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisUpdate'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisDescription'
        '400':
          $ref: '#/components/responses/AnalysisError'
        '403':
          $ref: '#/components/responses/AnalysisError'
        '404':
          $ref: '#/components/responses/AnalysisError'
        '409':
          $ref: '#/components/responses/AnalysisError'
        '422':
          $ref: '#/components/responses/AnalysisError'
        '428':
          $ref: '#/components/responses/AnalysisError'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
      - assets
      operationId: delete_analysis
      summary: Delete analysis
      description: Build plus co-owner and current asset revision. Analysis delete preserves published dashboards
        and severs republish; dataset references from any analysis block deletion with DATASET_DELETE_BLOCKED_BY_ANALYSIS
        (409). Shares are removed with the asset.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted current asset revision; published definitions keep their own Version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRemoved'
        '400':
          $ref: '#/components/responses/AssetError'
        '401':
          $ref: '#/components/responses/AssetError'
        '403':
          $ref: '#/components/responses/AssetError'
        '404':
          $ref: '#/components/responses/AssetError'
        '409':
          $ref: '#/components/responses/AssetError'
        '412':
          $ref: '#/components/responses/AssetError'
        '422':
          $ref: '#/components/responses/AssetError'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AssetError'
  /analyses/{id}/sheets/{sheetId}/visuals:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
      - name: sheetId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    post:
      tags: [analyses]
      operationId: add_visual
      summary: Add visual
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BundleVisual' }
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
