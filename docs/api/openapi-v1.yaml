openapi: 3.1.0
info:
  title: OpenSight headless API
  version: 1.0.0
  description: >-
    Builder-shaped REST surface for agents (issue #95, IDD D-37). Versioned
    and stable: breaking changes need a new version plus migration notes.
    The web app consumes the same API; existing unversioned routes are
    untouched. Slices: datasets, querying and analyses (implemented), dashboards,
    assets, MCP mapping.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: opensight.example
security:
  - bearerAuth: []
tags:
  - name: datasets
  - name: sources
  - name: querying
  - name: analyses
paths:
  /analyses:
    get:
      tags: [analyses]
      operationId: list_analyses
      summary: List analyses
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisPage' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [analyses]
      operationId: create_analysis
      summary: Create analysis
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalysisCreate' }
      responses:
        '201':
          description: Created
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /analyses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    get:
      tags: [analyses]
      operationId: describe_analysis
      summary: Describe analysis
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      tags: [analyses]
      operationId: update_analysis
      summary: Update analysis
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalysisUpdate' }
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '428': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [analyses]
      operationId: delete_analysis
      summary: Delete analysis
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRemoved' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '428': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /analyses/{id}/sheets/{sheetId}/visuals:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
      - name: sheetId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    post:
      tags: [analyses]
      operationId: add_visual
      summary: Add visual
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BundleVisual' }
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '428': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /analyses/{id}/sheets/{sheetId}/visuals/{visualId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
      - name: sheetId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
      - name: visualId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    put:
      tags: [analyses]
      operationId: update_visual
      summary: Update visual
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BundleVisual' }
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '428': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [analyses]
      operationId: remove_visual
      summary: Remove visual
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '428': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /analyses/{id}/sheets/{sheetId}/layouts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
      - name: sheetId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    put:
      tags: [analyses]
      operationId: set_layouts
      summary: Set layouts
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BundleLayouts' }
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '428': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /analyses/{id}/filter-groups:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    post:
      tags: [analyses]
      operationId: add_filter_group
      summary: Add filter group
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BundleFilterGroup' }
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '428': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /analyses/{id}/filter-groups/{filterGroupId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
      - name: filterGroupId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    put:
      tags: [analyses]
      operationId: update_filter_group
      summary: Update filter group
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BundleFilterGroup' }
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '428': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [analyses]
      operationId: remove_filter_group
      summary: Remove filter group
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '428': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /analyses/{id}/calculated-fields:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    put:
      tags: [analyses]
      operationId: set_calculated_fields
      summary: Set calculated fields
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BundleCalculatedFields' }
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted integer version of the entire analysis
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisDescription' }
        '400': { $ref: '#/components/responses/AnalysisError' }
        '403': { $ref: '#/components/responses/AnalysisError' }
        '404': { $ref: '#/components/responses/AnalysisError' }
        '409': { $ref: '#/components/responses/AnalysisError' }
        '422': { $ref: '#/components/responses/AnalysisError' }
        '428': { $ref: '#/components/responses/AnalysisError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /datasets:
    get:
      tags: [datasets]
      summary: List prepared datasets (paginated)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated dataset list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DatasetSummary' }
        '400': { $ref: '#/components/responses/BadPagination' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /datasets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
    get:
      tags: [datasets]
      summary: Composed dataset describe (schema + lineage pointers + refresh state)
      responses:
        '200':
          description: Composed describe
          content:
            application/json:
              schema:
                type: object
                required: [id, name, version, execution, schema, lineage, refresh]
                properties:
                  id: { type: string }
                  name: { type: string }
                  version: { type: integer }
                  execution:
                    type: object
                    properties:
                      mode: { type: string, enum: [DIRECT_QUERY, BLAZE] }
                      intervalMinutes: { type: ['integer', 'null'] }
                  schema:
                    type: object
                    properties:
                      columns:
                        type: array
                        items: { $ref: '#/components/schemas/Column' }
                  lineage:
                    type: object
                    properties:
                      sources:
                        type: array
                        items: { type: object, properties: { id: { type: string } } }
                      datasets:
                        type: array
                        items: { type: object, properties: { id: { type: string } } }
                      steps: { type: integer }
                  refresh:
                    type: object
                    properties:
                      supported: { type: boolean }
                      mode: { type: string }
                      intervalMinutes: { type: ['integer', 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [datasets]
      summary: Create or update a prepared dataset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, pipeline, expectedVersion]
              properties:
                name: { type: string, maxLength: 512 }
                pipeline:
                  type: object
                  description: PrepPipeline (version 1); see bundle-parser prep docs
                expectedVersion: { type: integer, description: 0 on create }
      responses:
        '200':
          description: Saved dataset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetSummary' }
    delete:
      tags: [datasets]
      summary: Delete a prepared dataset
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  removed: { type: boolean, enum: [true] }
        '428': { $ref: '#/components/responses/IfMatchRequired' }
  /datasets/{id}/query:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
    post:
      tags: [querying]
      operationId: runDatasetQuery
      summary: Query an owner-scoped prepared dataset using the visual query model
      description: >-
        Uses the existing hosted prepared-dataset execution path. The body is
        the InteractiveQuery sent by the UI, not a query or SQL envelope.
        Arbitrary SQL, identity assertions and unknown properties are rejected.
        Filter values and parameter bindings are data; calculated fields use
        the existing parsed QuickSight expression grammar, never SQL.
        Results are bounded by hosted execution budgets and are not paginated;
        Limit/Cursor list headers do not paginate queries. Query strings are
        rejected at the hosted request boundary. This is a read-only POST:
        If-Match is not needed. Idempotency replays last ten minutes on one
        node, are owner-scoped, repeat current graph/policy admission and
        validation, and are invalidated by metadata revision changes. Auth
        and publication checks run on original results and replays alike.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractiveQuery' }
            example:
              dimensions: [{ fieldId: region, columnName: region }]
              measures: [{ fieldId: total, columnName: amount, aggregation: SUM }]
              filters: [{ columnName: region, parameterName: Region }]
              parameterDeclarations: [{ name: Region, type: string, multiple: false }]
              parameterBindings: { Region: [east] }
      responses:
        '200':
          description: Complete query result; execution is present for a BLAZE dataset
          headers:
            Idempotent-Replayed:
              description: Present with value true on a successful replay
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryResult' }
              example:
                columns: [{ name: region, type: string }, { name: total, type: number }]
                rows: [{ region: east, total: 40 }]
        '400':
          description: HOSTED_REQUEST_INVALID (malformed query, SQL or extra properties), or METADATA_INVALID (invalid idempotency key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing, invalid, expired or revoked credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Forged principal, denied capability, protected prep or revised authorization/metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405':
          description: METHOD_NOT_ALLOWED (only POST is supported)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: HOSTED_REQUEST_INVALID (body exceeds 1 MiB)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Named query-engine validation error, including unresolved fields, unsupported expressions and security-policy errors
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: RATE_LIMIT_EXCEEDED, or an existing hosted budget/cache error (such as BLAZE_NOT_READY)
          headers:
            Retry-After:
              description: Seconds to wait; present for RATE_LIMIT_EXCEEDED
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          description: Named hosted execution or availability error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /datasets/{id}/lineage:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
    get:
      tags: [datasets]
      summary: Full lineage view (steps, resolved sources and datasets, refresh state)
      responses:
        '200':
          description: Lineage view
          content:
            application/json:
              schema:
                type: object
                required: [dataset, steps, sources, datasets, refresh]
                properties:
                  dataset:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      version: { type: integer }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        kind: { type: string }
                        name: { type: ['string', 'null'] }
                        from: { type: ['string', 'null'] }
                  sources:
                    type: array
                    items: { $ref: '#/components/schemas/LineageSource' }
                  datasets:
                    type: array
                    items: { $ref: '#/components/schemas/LineageDataset' }
                  refresh:
                    type: object
                    properties:
                      mode: { type: string }
                      intervalMinutes: { type: ['integer', 'null'] }
                      supported: { type: boolean }
  /datasets/{id}/refresh:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
    post:
      tags: [datasets]
      summary: Trigger a refresh (BLAZE datasets only; fail-closed otherwise)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0 }
      responses:
        '200':
          description: Refresh ran
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetId: { type: string }
                  refreshed: { type: boolean, enum: [true] }
                  mode: { type: string }
                  state: { type: string }
        '409':
          description: Dataset is not BLAZE-materialized
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      errorCode: { type: string, enum: [BLAZE_MODE_REQUIRED] }
  /datasets/{id}/refresh-status:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
    get:
      tags: [datasets]
      summary: Refresh state (mode, schedule, whether refresh is supported)
      responses:
        '200':
          description: Refresh state
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetId: { type: string }
                  version: { type: integer }
                  mode: { type: string }
                  intervalMinutes: { type: ['integer', 'null'] }
                  supported: { type: boolean }
  /sources:
    get:
      tags: [sources]
      summary: List sources (paginated)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated source list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SourceSummary' }
  /sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    get:
      tags: [sources]
      summary: Schema inspection for one source
      responses:
        '200':
          description: Source schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  version: { type: integer }
                  connectorId: { type: string }
                  columns:
                    type: array
                    items: { $ref: '#/components/schemas/Column' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [sources]
      summary: Retire a source (fail-closed while datasets reference it)
      description: >-
        Refuses with 409 SOURCE_DELETE_BLOCKED_BY_DATASET while any prepared
        dataset references the source, directly or through nested dataset
        refs. Interaction with in-flight durable upload reservations stays
        with #91's protocol work.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Retired
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  retired: { type: boolean, enum: [true] }
                  version: { type: integer }
        '409':
          description: Still referenced by prepared datasets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      errorCode: { type: string, enum: [SOURCE_DELETE_BLOCKED_BY_DATASET] }
        '428': { $ref: '#/components/responses/IfMatchRequired' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: User-level, tenant-scoped credential minted through the operator invitation path
  parameters:
    Limit:
      name: Limit
      in: header
      required: false
      description: >-
        Page size, 1–1000 (default 100). The hosted plane rejects query
        strings at the request boundary, so the frozen limit/cursor/nextCursor
        convention rides headers.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Cursor:
      name: Cursor
      in: header
      required: false
      description: Opaque page token from a previous nextCursor
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Honored on every v1 mutation and query POST (10-minute replay window, single node)
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted integer version, e.g. "3" (optimistic concurrency)
      schema: { type: string, pattern: '^"(0|[1-9][0-9]*)"$' }
  schemas:
    DatasetBindings:
      type: object
      description: >-
        Exact map from every BundleDefinition dataSetIdentifierDeclarations
        identifier to one typed reference. No extra or missing identifiers.
        Prepared datasets resolve only under the authenticated user's owner
        scope; legacy dataset source ownership must also match that user.
        No caller ownerId, tenantId, userId or ARN is execution authority.
        dataSetArn remains a definition label and is never used for resolution.
      propertyNames: { type: string, minLength: 1 }
      additionalProperties:
        oneOf:
          - type: object
            additionalProperties: false
            required: [kind, id]
            properties:
              kind: { const: dataset }
              id: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
          - type: object
            additionalProperties: false
            required: [kind, id]
            properties:
              kind: { const: prepared-dataset }
              id: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
    AnalysisCreate:
      type: object
      additionalProperties: false
      required: [analysisId, name, definition, datasetBindings]
      properties:
        analysisId: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
        name: { type: string, minLength: 1, maxLength: 512 }
        definition: { $ref: '#/components/schemas/BundleDefinition' }
        datasetBindings: { $ref: '#/components/schemas/DatasetBindings' }
    AnalysisUpdate:
      type: object
      additionalProperties: false
      required: [name, definition, datasetBindings]
      properties:
        name: { type: string, minLength: 1, maxLength: 512 }
        definition: { $ref: '#/components/schemas/BundleDefinition' }
        datasetBindings: { $ref: '#/components/schemas/DatasetBindings' }
    BundleDefinition:
      type: object
      required: [dataSetIdentifierDeclarations]
      description: >-
        CamelCase BundleDefinition, with opaque non-executable properties
        preserved. PascalCase writes, SQL envelopes/operators and principal or
        grant/placement assertions are rejected. All calculated fields,
        including unused fields and calculated measure expressions, pass the
        shared allowlisted expression parser against current authorized schema.
        Dangling dependencies reject all mutation forms. Empty sheets and
        incomplete field wells persist with located Errors diagnostics.
      properties:
        dataSetIdentifierDeclarations:
          type: array
          items:
            type: object
            required: [identifier, dataSetArn]
            properties:
              identifier: { type: string, minLength: 1 }
              dataSetArn: { type: string, minLength: 1 }
        sheets:
          type: array
          items:
            type: object
            required: [sheetId]
            properties:
              sheetId: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
              name: { type: string }
              visuals:
                type: array
                items: { $ref: '#/components/schemas/BundleVisual' }
              layouts: { $ref: '#/components/schemas/BundleLayouts' }
        calculatedFields: { $ref: '#/components/schemas/BundleCalculatedFields' }
        filterGroups:
          type: array
          items: { $ref: '#/components/schemas/BundleFilterGroup' }
        parameterDeclarations: { type: array, items: { type: object } }
    BundleVisual:
      type: object
      minProperties: 1
      maxProperties: 1
      description: One camelCase visual variant; visualId must match the path on replacement
      additionalProperties:
        type: object
        required: [visualId]
        properties:
          visualId: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    BundleLayouts:
      type: array
      description: Complete BundleSheet.layouts; an empty array removes layouts
      items: { type: object }
    BundleFilterGroup:
      type: object
      required: [filterGroupId, filters, scopeConfiguration, status]
      properties:
        filterGroupId: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
        filters: { type: array, items: { type: object } }
        scopeConfiguration: { type: object }
        status: { type: string, enum: [ENABLED, DISABLED] }
        crossDataset: { type: string }
    BundleCalculatedFields:
      type: array
      description: Complete calculatedFields collection; an empty array removes fields
      items:
        type: object
        additionalProperties: false
        required: [dataSetIdentifier, name, expression]
        properties:
          dataSetIdentifier: { type: string, minLength: 1 }
          name: { type: string, minLength: 1 }
          expression: { type: string, minLength: 1, maxLength: 10000 }
    AnalysisDescription:
      type: object
      additionalProperties: false
      required: [AnalysisId, Name, Definition, Errors]
      properties:
        AnalysisId: { type: string }
        Name: { type: string }
        Definition: { type: object, description: Existing PascalCase QuickSight definition projection }
        Errors:
          type: array
          items:
            type: object
            required: [errorCode, message, path]
            properties:
              errorCode: { type: string }
              message: { type: string }
              path: { type: string }
    AnalysisPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Pagination is applied after current asset and folder access filtering
          items:
            type: object
            required: [kind, id, name]
            properties:
              kind: { const: analysis }
              id: { type: string }
              name: { type: string }
        nextCursor: { type: [string, 'null'] }
    AnalysisRemoved:
      type: object
      required: [id, removed]
      properties:
        id: { type: string }
        removed: { const: true }
    Error:
      type: object
      required: [errorCode]
      properties:
        errorCode: { type: string, description: Machine-readable code, stable across versions }
        message: { type: string, description: Human-readable detail, never a secret }
        path: { type: string, description: Failing query field path when validation supplies one }
    InteractiveQuery:
      type: object
      additionalProperties: false
      required: [dimensions, measures, filters]
      properties:
        dimensions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fieldId, columnName]
            properties:
              fieldId: { type: string, minLength: 1 }
              columnName: { type: string, minLength: 1 }
              granularity: { type: string, description: Existing engine date granularity (for example MONTH) }
        measures:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [fieldId, columnName, aggregation]
            properties:
              fieldId: { type: string, minLength: 1 }
              columnName: { type: string, minLength: 1 }
              aggregation: { type: string, enum: [SUM, AVG, COUNT, MIN, MAX] }
        filters:
          type: array
          items: { $ref: '#/components/schemas/QueryFilter' }
        calculatedFields:
          type: array
          description: Existing parsed QuickSight calculated fields; SQL expressions are not accepted
          items:
            type: object
            additionalProperties: false
            required: [name, expression]
            properties:
              name: { type: string, minLength: 1 }
              expression: { type: string, minLength: 1 }
        parameterDeclarations:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/QueryParameter' }
        parameterBindings:
          type: object
          description: >-
            Exactly the declared names, each bound to an array matching its type.
            Single-value parameters accept at most one value. An empty array
            explicitly selects no matches. No extra or missing bindings.
          additionalProperties:
            type: array
            maxItems: 1000
            uniqueItems: true
            items: { type: [string, number] }
    QueryFilter:
      oneOf:
        - type: object
          additionalProperties: false
          required: [columnName, value]
          properties:
            columnName: { type: string, minLength: 1 }
            value: { type: string }
        - type: object
          additionalProperties: false
          required: [columnName, values]
          properties:
            columnName: { type: string, minLength: 1 }
            values: { type: array, items: { type: string } }
        - type: object
          additionalProperties: false
          required: [columnName, parameterName]
          properties:
            columnName: { type: string, minLength: 1 }
            parameterName: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,127}$' }
            operator:
              type: string
              enum: [EQUALS, GREATER_THAN_OR_EQUAL_TO, LESS_THAN_OR_EQUAL_TO]
              default: EQUALS
              description: Range comparisons require a single number or datetime parameter
    QueryParameter:
      type: object
      additionalProperties: false
      required: [name, type, multiple]
      properties:
        name: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,127}$' }
        type: { type: string, enum: [string, number, datetime] }
        multiple: { type: boolean }
        integer: { type: boolean, description: Only valid for number parameters; true requires safe integers }
      description: >-
        Names must be unique. Datetime parameters must be single-value and
        bind ISO dates or UTC datetimes. String values exclude NUL and are
        limited to 10000 characters. Numbers must be finite.
    QueryResult:
      type: object
      additionalProperties: false
      required: [columns, rows]
      properties:
        columns:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, type]
            properties:
              name: { type: string }
              type: { type: string, enum: [string, number] }
        rows:
          type: array
          description: Objects keyed by column name, with exactly one cell per column; each cell matches the column type or is null
          items:
            type: object
            additionalProperties: { type: [string, number, 'null'] }
        execution:
          type: object
          additionalProperties: false
          required: [mode, cached]
          description: >-
            Present when the queried dataset is BLAZE-materialized. Describes
            the dataset execution mode, not source freshness or the modes of
            nested inputs. Hosted cache adapters do not expose a shared
            refresh timestamp, so none is fabricated here.
          properties:
            mode: { type: string, enum: [BLAZE] }
            cached: { type: boolean, const: true }
    Page:
      type: object
      required: [items, nextCursor]
      properties:
        nextCursor: { type: ['string', 'null'], description: Opaque token for the next page, null at the end }
    Column:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [INTEGER, DECIMAL, STRING, DATETIME, BOOLEAN] }
    DatasetSummary:
      type: object
      required: [id, name, version, execution]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        execution:
          type: object
          properties:
            mode: { type: string, enum: [DIRECT_QUERY, BLAZE] }
            intervalMinutes: { type: ['integer', 'null'] }
    SourceSummary:
      type: object
      required: [id, available]
      properties:
        id: { type: string }
        version: { type: integer }
        connectorId: { type: string }
        available: { type: boolean }
        errorCode: { type: string }
    LineageSource:
      type: object
      required: [id, available]
      properties:
        id: { type: string }
        connectorId: { type: string }
        version: { type: integer }
        available: { type: boolean }
        errorCode: { type: string }
    LineageDataset:
      type: object
      required: [id, available]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        available: { type: boolean }
        errorCode: { type: string }
        inputs:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [source, dataset] }
              id: { type: string }
  responses:
    AnalysisError:
      description: >-
        Named error. Missing If-Match is 428 V1_IF_MATCH_REQUIRED; malformed
        If-Match is 400 V1_IF_MATCH_INVALID; stale version is 409
        METADATA_CONFLICT. Validation errors include a field path. Every
        update/delete requires the quoted current whole-analysis version.
        Creates require build capability and grant creator co-owner; edits
        require build plus co-owner through asset and folder grants. Definition
        bodies cannot overwrite grants or placement. Deletes retain published
        dashboard definitions. Idempotency-Key uses the established ten-minute
        single-node convention, checks current access on replay, rejects
        conflicting payloads and never repeats a write. Successful edits
        increment the analysis version exactly once.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Per-tenant rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  errorCode: { type: string, enum: [RATE_LIMIT_EXCEEDED] }
    BadPagination:
      description: Invalid Limit or Cursor header
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  errorCode: { type: string, enum: [INVALID_PAGINATION] }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IfMatchRequired:
      description: Optimistic-concurrency version missing or malformed
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  errorCode: { type: string, enum: [V1_IF_MATCH_REQUIRED, V1_IF_MATCH_INVALID] }
