    DashboardShare:
      $ref: '#/components/schemas/AssetShare'
    DashboardShareWrite:
      type: object
      additionalProperties: false
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - viewer
          - co-owner
    DashboardShareDeleted:
      $ref: '#/components/schemas/AssetShareDeleted'
    DashboardRemoved:
      type: object
      additionalProperties: false
