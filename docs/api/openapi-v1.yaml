        '422':
          $ref: '#/components/responses/AssetError'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AssetError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: User-level, tenant-scoped credential minted through the operator invitation path
  parameters:
    Limit:
      name: Limit
      in: header
      required: false
      description: >-
        Page size, 1–1000 (default 100). The hosted plane rejects query
        strings at the request boundary, so the frozen limit/cursor/nextCursor
        convention rides headers.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Cursor:
      name: Cursor
      in: header
      required: false
      description: Opaque page token from a previous nextCursor
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Honored on every v1 mutation and query POST (10-minute replay window, single node)
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted integer version, e.g. "3" (optimistic concurrency)
      schema: { type: string, pattern: '^"(0|[1-9][0-9]*)"$' }
  schemas:
    AssetSummary:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      - name
      - folderId
      properties:
        kind:
          type: string
          enum:
          - analyses
          - dashboards
          - datasets
        id:
          type: string
        name:
          type: string
        folderId:
          type:
          - string
          - 'null'
    AssetPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssetSummary'
        nextCursor:
          type:
          - string
          - 'null'
    AssetSearch:
      type: object
      additionalProperties: false
      required:
      - query
      properties:
        query:
          type: string
          maxLength: 512
        kinds:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - analyses
            - dashboards
            - datasets
        scope:
          description: Reserved pending confirmed JSON shape; explicit values return 422 ASSET_SCOPE_UNSPECIFIED.
    AssetMove:
      type: object
      additionalProperties: false
      required:
      - folderId
      properties:
        folderId:
          type:
          - string
          - 'null'
    AssetCopy:
      type: object
      additionalProperties: false
      required:
      - newId
      properties:
        folderId:
          type:
          - string
          - 'null'
        newId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,512}$
        name:
          type: string
          minLength: 1
          maxLength: 512
    AssetTransfer:
      type: object
      additionalProperties: false
      required:
      - Kind
      - Id
      - Name
      - FolderId
      properties:
        Kind:
          type: string
          enum:
          - analyses
          - dashboards
        Id:
          type: string
        Name:
          type: string
        FolderId:
          type:
          - string
          - 'null'
    AssetShare:
      type: object
      additionalProperties: false
      required:
      - Principal
      - Role
      properties:
        Principal:
          type: object
          additionalProperties: false
          required:
          - Type
          - Id
          properties:
            Type:
              type: string
              enum:
              - user
              - group
            Id:
              type: string
        Role:
          type: string
          enum:
          - viewer
          - co-owner
    AssetShareDeleted:
      type: object
      additionalProperties: false
      required:
      - Deleted
      properties:
        Deleted:
          const: true
    FolderDescription:
      type: object
      additionalProperties: false
      required:
