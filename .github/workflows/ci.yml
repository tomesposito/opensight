name: OpenSight CI and release
on:
  pull_request:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check tracked source boundaries
        run: node ops/serverless/ci-check.mjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Acquire pinned infrastructure tooling and validate mock plans
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          TF_IN_AUTOMATION: 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_arm64.zip --output /tmp/tofu.zip
          printf '%s  %s\n' b9614df40575cc3fc10a8a25025b7245d961da279f715ea3efff4ddae8e6938a /tmp/tofu.zip | sha256sum --check
          unzip -q /tmp/tofu.zip -d /tmp/opensight-tofu
          for root in validation ingress ci-access monitoring; do
            before=$(sha256sum "ops/serverless/$root/.terraform.lock.hcl")
            /tmp/opensight-tofu/tofu -chdir="ops/serverless/$root" init -backend=false -input=false
            test "$before" = "$(sha256sum "ops/serverless/$root/.terraform.lock.hcl")"
            /tmp/opensight-tofu/tofu -chdir="ops/serverless/$root" validate
            /tmp/opensight-tofu/tofu -chdir="ops/serverless/$root" test
          done
      - name: Test and build offline
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ops/serverless/Dockerfile
          target: test
          platforms: linux/arm64
          load: true
          tags: opensight-tested:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trusted-arm64
          cache-to: type=gha,mode=max,scope=${{ github.event_name == 'pull_request' && format('pr-{0}-arm64', github.event.pull_request.number) || 'trusted-arm64' }}
      - name: PostgreSQL integration on an isolated network
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          docker network create --internal opensight-ci
          docker run -d --name opensight-pg --network opensight-ci --tmpfs /var/lib/postgresql/data:rw -e POSTGRES_HOST_AUTH_METHOD=trust postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          for attempt in {1..30}; do
            if docker exec opensight-pg pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker run --rm --network opensight-ci -e DATABASE_URL=postgresql://postgres@opensight-pg/postgres --entrypoint node opensight-tested:ci ops/serverless/ci-postgres.mjs
      - name: Package the tested runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ops/serverless/Dockerfile
          target: runtime
          platforms: linux/arm64
          load: true
          tags: opensight-runtime:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trusted-arm64
      - name: Verify exact runtime and export frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/frontend
          docker run --rm --network none --read-only --user 1000:1000 --tmpfs /tmp:rw,nosuid,nodev,size=512m --entrypoint node -i opensight-runtime:ci --input-type=module < ops/serverless/image-smoke.mjs
          container=$(docker create opensight-tested:ci)
          docker cp "$container:/frontend/." release/frontend/
          docker rm "$container"
          tar -czf release/frontend.tar.gz -C release/frontend .
          docker run --rm --network none --read-only --entrypoint node -i opensight-runtime:ci --input-type=module < ops/serverless/runtime-sbom.mjs > release/runtime-sbom.json
      - name: Assemble the marketing site with the offline demo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          node site/check.mjs
          mkdir site-dist
          cp -R release/frontend/marketing/. site-dist/
          test -s site-dist/demo/index.html
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {digest} from './ops/serverless/release-manifest.mjs'; import {marketingFiles} from './ops/serverless/frontend-policy.mjs'; const m=JSON.parse(readFileSync('release/frontend/manifest.json')); for (const p of marketingFiles) if (digest(readFileSync('site-dist/'+p.slice(10)))!==m.files[p]) throw Error('SITE_ARTIFACT_MISMATCH');"
      - name: Upload the marketing site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-${{ github.sha }}
          path: site-dist/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
      - name: Export immutable image archive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ops/serverless/Dockerfile
          target: runtime
          platforms: linux/arm64
          outputs: type=oci,dest=release/runtime.oci.tar,oci-mediatypes=false
          provenance: false
          sbom: false
      - name: Bind release manifest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: node ops/serverless/release-manifest.mjs release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          name: release-${{ github.sha }}
          path: |
            release/runtime.oci.tar
            release/frontend.tar.gz
            release/runtime-sbom.json
            release/release.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Remove test resources
        if: always()
        run: |
          docker rm -f opensight-pg 2>/dev/null || true
          docker network rm opensight-ci 2>/dev/null || true
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    steps:
      - name: Acquire pinned GitHub CLI (MIT)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz --output /tmp/gh.tar.gz
          printf '%s  %s\n' bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386 /tmp/gh.tar.gz | sha256sum --check
          tar -xzf /tmp/gh.tar.gz -C /tmp
          echo /tmp/gh_2.102.0_linux_amd64/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Attest the manifest binding all release bytes
        id: attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: release/release.json
      - name: Publish immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          PROVENANCE_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" release/provenance.jsonl
          gh release create "build-$RELEASE_SOURCE" release/* --repo "$RELEASE_REPO" --target "$RELEASE_SOURCE" --title "Application build $RELEASE_SOURCE" --notes 'Tested Linux ARM64 runtime, hosted frontend, dependency inventory and attested release manifest. Publishing does not deploy.'
          gh api --method DELETE "repos/$RELEASE_REPO/actions/artifacts/$ARTIFACT_ID"
