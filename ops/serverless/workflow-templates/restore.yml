# Copy only to the private controller repository; invoke this reusable workflow
# through a manual wrapper pinned to its reviewed 40-character commit. See README.
name: OpenSight private restore
on:
  workflow_call:
    inputs:
      config_revision:
        type: string
        required: true
      selection:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: opensight-production-controller
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ vars.OPENSIGHT_PUBLIC_REPOSITORY }}
          ref: ${{ vars.OPENSIGHT_CONTROL_SOURCE }}
          persist-credentials: false
      - name: Verify pinned private workflow identity and inputs
        env:
          CONFIG_REVISION: ${{ inputs.config_revision }}
          SELECTED: ${{ inputs.selection }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          if (!/^[a-f0-9]{64}$/.test(process.env.CONFIG_REVISION) || (process.env.SELECTED && !/^[a-f0-9]{64}$/.test(process.env.SELECTED))) throw Error('SELECTION_INVALID');
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL); url.searchParams.set('audience','sts.amazonaws.com');
          const response = await fetch(url,{headers:{authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}});
          if (!response.ok) throw Error('OIDC_IDENTITY_UNAVAILABLE');
          const {value} = await response.json(); const claims = JSON.parse(Buffer.from(value.split('.')[1],'base64url'));
          if (!/^[a-f0-9]{40}$/.test(claims.job_workflow_sha ?? '') || !claims.job_workflow_ref.endsWith('@'+claims.job_workflow_sha) || claims.event_name !== 'workflow_dispatch') throw Error('PINNED_MANUAL_CONTROLLER_REQUIRED');
          appendFileSync(process.env.GITHUB_ENV,'OPENSIGHT_PRIVATE_COMMIT='+claims.job_workflow_sha+'\n');
          NODE
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.OPENSIGHT_RESTORE_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 1800
          mask-aws-account-id: true
          retry-max-attempts: 2
      - name: Fetch encrypted private inputs outside Git
        env:
          BUCKET: ${{ vars.OPENSIGHT_OPERATIONS_BUCKET }}
          CONFIG_REVISION: ${{ inputs.config_revision }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          directory="$RUNNER_TEMP/opensight-maintenance"
          mkdir -p "$directory"
          chmod 700 "$directory"
          for file in maintenance-config.json maintenance.tfvars.json maintenance.backend.hcl; do
            aws s3api get-object --bucket "$BUCKET" --key "maintenance/configs/$CONFIG_REVISION/$file" "$directory/$file" >/dev/null
          done
          printf '%s  %s\n' "$CONFIG_REVISION" "$directory/maintenance-config.json" | sha256sum --check --status
          echo "OPENSIGHT_OPERATOR_DIR=$directory" >> "$GITHUB_ENV"
      - name: Execute reviewed restore
        env:
          SELECTED: ${{ inputs.selection }}
        run: node ops/serverless/maintenance-invoke.mjs restore "$SELECTED"
