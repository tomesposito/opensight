# TEMPLATE — not a live workflow. See README.md.
# Private plan workflow: read-only infrastructure plan with a digest-bound envelope.
name: OpenSight private plan (template)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (e.g. pilot)'
        required: true
      config_revision:
        description: 'Configuration revision to plan against'
        required: true
permissions:
  contents: read
concurrency:
  group: opensight-deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # only this job assumes the plan role
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      # 1. Assume the PLAN role via short-lived OIDC (1h max). The plan role
      #    may read resource configuration/state and write only its lock and
      #    the private plan record. No resource mutation, no secret fetch.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ vars.OPENSIGHT_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      # 2. Acquire pinned OpenTofu 1.13.1 (hash-verified) and validate the
      #    module tree offline before any remote operation.
      # 3. tofu init -backend with the private backend config; tofu plan
      #    -out=plan.tfplan -detailed-exitcode. Never -lock=false.
      # 4. Build the digest-bound envelope: public/private commits,
      #    module/provider/tool locks, environment/configuration revision,
      #    backend identity, state lineage/serial, selected release digest.
      # 5. Store the envelope encrypted in restricted operational storage
      #    (outside git, outside public CI artifacts). Validity: 24 hours.
      # 6. Emit the envelope digest for the approval record. The plan bytes
      #    themselves never appear in logs.
